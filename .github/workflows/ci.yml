name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run checker self-test and live check
        run: |
          python3 tools/check_repo.py --self-test
          python3 tools/check_repo.py
